<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html,body{margin:0;width:1932px;height:828px;overflow:hidden}
body{background:radial-gradient(70% 120% at 30% 40%,#ffd84d 0%,#fdc300 55%,#f7b900 100%);font-family:'Pretendard Variable',Pretendard,sans-serif;color:#191f28;word-break:keep-all;position:relative}
.left{position:absolute;left:150px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.mark{width:150px;height:164px;overflow:hidden;margin-bottom:34px}
.mark img{width:150px;display:block}
h1{margin:0;font-size:112px;font-weight:700;letter-spacing:-4px;line-height:1.1}
p{margin:26px 0 0;font-size:44px;font-weight:600;letter-spacing:-1.2px;line-height:1.4;color:#3a3220}
.phone{position:absolute;width:376px;padding:12px;border-radius:50px;background:#191f28;box-shadow:0 30px 60px rgba(80,55,0,.28)}
.screen{width:376px;height:813px;border-radius:38px;overflow:hidden;background:#f2f2f7}
.screen img{width:376px;display:block}
.p1{left:1060px;top:130px}
.p2{left:1490px;top:70px}
</style></head><body>
<div class="left">
  <div class="mark"><img src="church.png"></div>
  <h1>365일 묵상집</h1>
  <p>하루 한 편 말씀을 읽고<br>마음에 남은 것을 기록해요</p>
</div>
<div class="phone p1"><div class="screen"><img src="today.png"></div></div>
<div class="phone p2"><div class="screen"><img src="calendar.png"></div></div>
</body></html>
